spring:
  application:
    name: monitor-catraca

  datasource:
    url: jdbc:postgresql://localhost:5432/monitor_catraca
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      lifecycle-management: start-only