services:
  postgres:
    image: postgres:17-alpine
    container_name: monitor-catraca-db
    environment:
      POSTGRES_DB: monitor_catraca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitor_catraca"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: